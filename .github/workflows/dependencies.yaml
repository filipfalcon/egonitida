name: Dependencies
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, reopened]
jobs:
  Approval:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dependencies
    permissions:
      pull-requests: write
    steps:
      - name: Mark the adoption as dispatched
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PULL_REQUEST" \
            --remove-label "Dependencies | Queued" \
            --add-label "Dependencies | Dispatched"

  Update:
    needs: Approval
    if: |
      !cancelled() &&
      (needs.Approval.result == 'success' || needs.Approval.result == 'skipped') &&
      ((github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/update-dependency') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '/update-dependency') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '/update-dependency') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '^24.15.0'
      - name: Install the dependencies
        run: npm ci
      - name: Run Claude
        uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1.0.199
        with:
          trigger_phrase: '/update-dependency'
          prompt: ${{ github.event_name == 'pull_request' && '/update-dependency' || '' }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model claude-opus-5 --allowedTools Bash
      - name: Mark the adoption as failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh pr edit "$PULL_REQUEST" \
            --remove-label "Dependencies | Queued" \
            --remove-label "Dependencies | Dispatched" \
            --remove-label "Dependencies | Adopted" \
            --remove-label "Dependencies | Blocked" \
            --add-label "Dependencies | Failed"
