name: Check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and npm as the package.json's devEngines say, and the dependencies installed and cached.
      - name: Set up Vite+, Node, and npm
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
      # Formatting, lint, and types, as the pre-commit hook runs them, but over every file.
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      # The engine's theory in Lean: every theorem in verification/ must hold, with no `sorry`.
      - name: Verify
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: verification
